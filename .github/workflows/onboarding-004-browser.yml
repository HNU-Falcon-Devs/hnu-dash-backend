name: Onboarding 004 paired browser QA
on:
  push:
    branches: [qa/onboarding-004-browser]
permissions:
  contents: read
concurrency:
  group: onboarding-004-browser
  cancel-in-progress: false
jobs:
  onboarding-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      HNU_DASH_ISOLATED_TEST_DB: '1'
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout pinned Web
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HNU-Falcon-Devs/hnu-dash-web
          ref: 9a621390d76919b646455ee2d6322cf7fbeef7aa
          path: qa-web
          persist-credentials: false
      - name: Checkout legacy Web
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HNU-Falcon-Devs/hnu-dash-web
          ref: 14db11483b59c847e902f440843e12beee36eff6
          path: qa-old-web
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify revisions and runner isolation
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REF" = refs/heads/qa/onboarding-004-browser
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C qa-web rev-parse HEAD)" = 9a621390d76919b646455ee2d6322cf7fbeef7aa
          test "$(git -C qa-old-web rev-parse HEAD)" = 14db11483b59c847e902f440843e12beee36eff6
          node --check scripts/qa-onboarding-004.mjs
          git diff --exit-code 07055c9ef6bdc531990b0ca403c061ee8aae27c6 HEAD -- supabase package.json package-lock.json .github/workflows/ci.yml
          test "$(git diff --name-only 07055c9ef6bdc531990b0ca403c061ee8aae27c6 HEAD | sort)" = "$(printf '%s\n' .github/workflows/onboarding-004-browser.yml scripts/qa-onboarding-004.mjs | sort)"
          git merge-base --is-ancestor 07055c9ef6bdc531990b0ca403c061ee8aae27c6 HEAD
          test -z "$(docker ps -aq --filter name=supabase_)"
          printf 'QA HEAD=%s; Web=%s; Backend=07055c9ef6bdc531990b0ca403c061ee8aae27c6\n' "$GITHUB_SHA" "$(git -C qa-web rev-parse HEAD)"
      - name: Install pinned dependencies
        run: |
          npm ci
          npm --prefix qa-web ci
          npm --prefix qa-old-web ci
          mkdir -p "$RUNNER_TEMP/onboarding-004-tools"
          npm --prefix "$RUNNER_TEMP/onboarding-004-tools" install --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/onboarding-004-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start disposable Supabase
        run: |
          touch "$RUNNER_TEMP/onboarding-004-stack-owned"
          ./node_modules/.bin/supabase start > "$RUNNER_TEMP/onboarding-004-start.log" 2>&1
          ./node_modules/.bin/supabase status -o json > "$RUNNER_TEMP/onboarding-004-local.json" 2>/dev/null
          chmod 600 "$RUNNER_TEMP/onboarding-004-local.json"
          test "$(docker ps --filter name=^/supabase_db_hnu-dash-backend$ --format '{{.Names}}')" = supabase_db_hnu-dash-backend
          echo 'Disposable Supabase started; credentials withheld.'
      - name: Execute paired onboarding and mismatch journeys
        run: node scripts/qa-onboarding-004.mjs
      - name: Stop disposable Supabase
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/onboarding-004-stack-owned"; then
            ./node_modules/.bin/supabase stop --no-backup > "$RUNNER_TEMP/onboarding-004-stop.log" 2>&1
            test -z "$(docker ps --filter name=supabase_ --format '{{.Names}}')"
            echo 'Disposable stack stopped.'
          fi
          rm -f "$RUNNER_TEMP/onboarding-004-local.json" "$RUNNER_TEMP/onboarding-004-start.log" "$RUNNER_TEMP/onboarding-004-stop.log"
