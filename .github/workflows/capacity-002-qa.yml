name: HNU DASH capacity 002 temporary QA
on:
  push:
    branches: [qa/capacity-002]
permissions:
  contents: read
concurrency:
  group: capacity-002-temporary-qa
  cancel-in-progress: false
jobs:
  capacity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      HNU_DASH_ISOLATED_TEST_DB: '1'
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout accepted Web
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HNU-Falcon-Devs/hnu-dash-web
          ref: 064c82367bb5d06da40b92ff6908329bde6631f4
          path: qa-web
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify revisions and runner isolation
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REF" = refs/heads/qa/capacity-002
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C qa-web rev-parse HEAD)" = 064c82367bb5d06da40b92ff6908329bde6631f4
          git diff --exit-code 3a1f3a11a0db1cab2bc0716949fa5a7ab761cae3 HEAD -- supabase package.json package-lock.json .github/workflows/ci.yml
          test "$(git diff --name-only 3a1f3a11a0db1cab2bc0716949fa5a7ab761cae3 HEAD | sort)" = "$(printf '%s\n' .github/workflows/capacity-002-qa.yml scripts/qa-capacity-002.mjs | sort)"
          git merge-base --is-ancestor 3a1f3a11a0db1cab2bc0716949fa5a7ab761cae3 HEAD
          test -z "$(docker ps -aq --filter name=supabase_)"
          printf 'QA HEAD=%s; Web=%s; Backend=3a1f3a11a0db1cab2bc0716949fa5a7ab761cae3\n' "$GITHUB_SHA" "$(git -C qa-web rev-parse HEAD)"
      - name: Install pinned dependencies
        run: |
          npm ci
          npm --prefix qa-web ci
          mkdir -p "$RUNNER_TEMP/capacity-002-tools"
          npm --prefix "$RUNNER_TEMP/capacity-002-tools" install --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/capacity-002-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start disposable Supabase
        run: |
          touch "$RUNNER_TEMP/capacity-002-stack-owned"
          ./node_modules/.bin/supabase start > "$RUNNER_TEMP/capacity-002-start.log" 2>&1
          ./node_modules/.bin/supabase status -o json > "$RUNNER_TEMP/capacity-002-local.json" 2>/dev/null
          chmod 600 "$RUNNER_TEMP/capacity-002-local.json"
          test "$(docker ps --filter name=^/supabase_db_hnu-dash-backend$ --format '{{.Names}}')" = supabase_db_hnu-dash-backend
          echo 'Disposable Supabase started; credentials withheld.'
      - name: Execute bounded synthetic capacity workload
        run: |
          node --check scripts/qa-capacity-002.mjs
          node scripts/qa-capacity-002.mjs
      - name: Stop disposable Supabase
        if: always()
        run: |
          status=0
          if test -f "$RUNNER_TEMP/capacity-002-stack-owned"; then
            ./node_modules/.bin/supabase stop --no-backup > "$RUNNER_TEMP/capacity-002-stop.log" 2>&1 || status=1
            test -z "$(docker ps --filter name=supabase_ --format '{{.Names}}')" || status=1
          fi
          rm -f "$RUNNER_TEMP/capacity-002-local.json" "$RUNNER_TEMP/capacity-002-start.log" "$RUNNER_TEMP/capacity-002-stop.log" "$RUNNER_TEMP/capacity-002-stack-owned"
          test "$status" = 0
          echo 'Disposable stack stopped.'
