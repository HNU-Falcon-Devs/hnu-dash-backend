name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run supabase -- --version
      - name: Test CSV import conversion
        run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - name: Start local Supabase
        run: npm run supabase -- start
      - name: Verify existing memberships survive upgrade
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: |
          node --check scripts/test_verified_membership.mjs
          npm run supabase -- db reset --version 20261127054432
          node scripts/test_verified_membership.mjs upgrade-seed
          npm run supabase -- migration up --local
          node scripts/test_verified_membership.mjs upgrade-check
      - name: Verify populated legacy attendance survives B1 upgrade
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: |
          npm run supabase -- db reset --version 20261127105700
          python3 scripts/test_offline_b1.py upgrade-seed
          npm run supabase -- migration up --local
          python3 scripts/test_offline_b1.py upgrade-check
      - name: Reset and lint database
        run: |
          npm run supabase -- db reset
          npm run supabase -- db lint
      - name: Run database authorization and import tests
        run: npm run supabase -- test db
      - name: Verify checkpoint freeze race with two database sessions
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: python3 scripts/test_checkpoint_freeze_race.py
      - name: Verify competing DRAFT to OPEN transitions with two sessions
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: python3 scripts/test_event_open_race.py
      - name: Verify concurrent UUID retries and unique accepted captures
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: python3 scripts/test_scan_ingestion_races.py
      - name: Verify closure and finalization races with two sessions
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: python3 scripts/test_attendance_finalization_races.py
      - name: Verify offline preparation and upload races
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: python3 scripts/test_offline_evidence_races.py
      - name: Verify offline reconciliation races
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: python3 scripts/test_offline_reconciliation_races.py
      - name: Verify B1 lifecycle and preparation races
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: python3 scripts/test_offline_b1.py races
      - name: Verify signed membership intents and concurrency
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: node scripts/test_verified_membership.mjs
      - name: Stop local Supabase
        if: always()
        run: npm run supabase -- stop
