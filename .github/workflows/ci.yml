name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run supabase -- --version
      - name: Test CSV import conversion
        run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - name: Start local Supabase
        run: npm run supabase -- start
      - name: Reset and lint database
        run: |
          npm run supabase -- db reset
          npm run supabase -- db lint
      - name: Run database authorization and import tests
        run: npm run supabase -- test db
      - name: Verify checkpoint freeze race with two database sessions
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: python3 scripts/test_checkpoint_freeze_race.py
      - name: Verify competing DRAFT to OPEN transitions with two sessions
        env:
          HNU_DASH_ISOLATED_TEST_DB: '1'
        run: python3 scripts/test_event_open_race.py
      - name: Stop local Supabase
        if: always()
        run: npm run supabase -- stop
