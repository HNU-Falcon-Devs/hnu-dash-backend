name: Coverage performance regression
on:
  push:
    branches: [fix/coverage-perf-002]
permissions:
  contents: read
concurrency:
  group: coverage-perf-002
  cancel-in-progress: false
jobs:
  coverage:
    name: Authenticated coverage regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HNU_DASH_ISOLATED_TEST_DB: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify revision and isolation
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REF" = refs/heads/fix/coverage-perf-002
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 43dcb7febd5cdc1b50bb249487f92f1fe66fa21d
          test "$(git diff --name-only 43dcb7febd5cdc1b50bb249487f92f1fe66fa21d HEAD | sort)" = "$(printf '%s\n' .github/workflows/coverage-perf-002.yml scripts/test_coverage_perf_002.mjs supabase/migrations/20261127054432_optimize_checkpoint_coverage.sql | sort)"
          git diff --exit-code 43dcb7febd5cdc1b50bb249487f92f1fe66fa21d HEAD -- .github/workflows/ci.yml package.json package-lock.json supabase/config.toml
          test -z "$(docker ps -aq --filter name=supabase_)"
          printf 'Backend baseline=43dcb7febd5cdc1b50bb249487f92f1fe66fa21d; candidate=%s\n' "$GITHUB_SHA"
      - name: Install pinned dependencies
        run: npm ci
      - name: Start disposable Supabase
        run: |
          touch "$RUNNER_TEMP/coverage-perf-002-owned"
          ./node_modules/.bin/supabase start > "$RUNNER_TEMP/coverage-perf-002-start.log" 2>&1
          ./node_modules/.bin/supabase status -o json > "$RUNNER_TEMP/coverage-perf-002-local.json" 2>/dev/null
          chmod 600 "$RUNNER_TEMP/coverage-perf-002-local.json"
          test "$(docker ps --filter name=^/supabase_db_hnu-dash-backend$ --format '{{.Names}}')" = supabase_db_hnu-dash-backend
          echo 'Disposable Supabase started; credentials withheld.'
      - name: Test actual authenticated RPC and capture plans
        run: |
          node --check scripts/test_coverage_perf_002.mjs
          node scripts/test_coverage_perf_002.mjs
      - name: Stop disposable Supabase
        if: always()
        run: |
          status=0
          if test -f "$RUNNER_TEMP/coverage-perf-002-owned"; then
            ./node_modules/.bin/supabase stop --no-backup > "$RUNNER_TEMP/coverage-perf-002-stop.log" 2>&1 || status=1
            test -z "$(docker ps --filter name=supabase_ --format '{{.Names}}')" || status=1
          fi
          rm -f "$RUNNER_TEMP/coverage-perf-002-local.json" "$RUNNER_TEMP/coverage-perf-002-start.log" "$RUNNER_TEMP/coverage-perf-002-stop.log" "$RUNNER_TEMP/coverage-perf-002-owned"
          test "$status" = 0
          echo 'Disposable stack stopped; temporary credential files removed.'
