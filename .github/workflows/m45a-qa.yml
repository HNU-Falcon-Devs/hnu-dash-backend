name: M4.5A temporary integration QA
on:
  push:
    branches: [qa/m4p5a-offline-lifecycle]
permissions:
  contents: read
concurrency:
  group: m45a-temporary-qa
  cancel-in-progress: false
jobs:
  offline-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      HNU_DASH_ISOLATED_TEST_DB: '1'
    steps:
      - name: Checkout QA harness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Checkout accepted Web
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: HNU-Falcon-Devs/hnu-dash-web
          ref: 7701aa097cc959127519665b0efd7f82e3d060ab
          path: qa-web
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Verify revisions and runner isolation
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$GITHUB_REF" = refs/heads/qa/m4p5a-offline-lifecycle
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C qa-web rev-parse HEAD)" = 7701aa097cc959127519665b0efd7f82e3d060ab
          git diff --exit-code 7475aa4e64be57f36399bbaa2166a00700f0abb5 HEAD -- supabase package.json package-lock.json .github/workflows/ci.yml
          test "$(git diff --name-only 7475aa4e64be57f36399bbaa2166a00700f0abb5 HEAD | sort)" = "$(printf '%s\n' .github/workflows/m45a-qa.yml scripts/qa-m45a.mjs | sort)"
          git merge-base --is-ancestor 7475aa4e64be57f36399bbaa2166a00700f0abb5 HEAD
          test -z "$(docker ps -aq --filter name=supabase_)"
          printf 'QA HEAD=%s; Web=%s; Backend=7475aa4e64be57f36399bbaa2166a00700f0abb5\n' "$GITHUB_SHA" "$(git -C qa-web rev-parse HEAD)"
      - name: Install pinned dependencies
        run: |
          npm ci
          npm --prefix qa-web ci
          mkdir -p "$RUNNER_TEMP/m45a-tools"
          npm --prefix "$RUNNER_TEMP/m45a-tools" install --no-save --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/m45a-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Start disposable Supabase
        run: |
          touch "$RUNNER_TEMP/m45a-stack-owned"
          ./node_modules/.bin/supabase start > "$RUNNER_TEMP/m45a-start.log" 2>&1
          ./node_modules/.bin/supabase status -o json > "$RUNNER_TEMP/m45a-local.json" 2>/dev/null
          chmod 600 "$RUNNER_TEMP/m45a-local.json"
          test "$(docker ps --filter name=^/supabase_db_hnu-dash-backend$ --format '{{.Names}}')" = supabase_db_hnu-dash-backend
          echo 'Disposable Supabase started; credentials withheld.'
      - name: Execute actual browser and database journey
        run: node scripts/qa-m45a.mjs
      - name: Stop disposable Supabase
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/m45a-stack-owned"; then
            ./node_modules/.bin/supabase stop --no-backup > "$RUNNER_TEMP/m45a-stop.log" 2>&1
            test -z "$(docker ps --filter name=supabase_ --format '{{.Names}}')"
            echo 'Disposable stack stopped.'
          fi
          rm -f "$RUNNER_TEMP/m45a-local.json" "$RUNNER_TEMP/m45a-start.log" "$RUNNER_TEMP/m45a-stop.log"
